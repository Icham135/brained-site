<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Brained Agents</title>
<link rel="icon" href="../icon.svg">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="../icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Cockpit">
<meta name="theme-color" content="#0F0E14">

  <link rel="stylesheet" href="../fonts/fonts.css" />
<style>
/* Agents: Generator (Post-Übersetzer) oben, darunter Aufrufe, vier Personas, Rangliste, Analyse-Agent mit Protokoll */
:root {
  --bg: #F6F4F1; --card: #FFFFFF; --ink: #16131F; --ink2: #5F5A70; --ink3: #9A95A8; --line: #E8E3DC; --soft: #EEECEF;
  --violet: #6D5BFF; --ok: #1E9E62; --ok-soft: #DDF5E9; --warn: #B7791F; --warn-soft: #FCF0D9; --bad: #D14343; --brand: #FF4F87;
  --tt: #111111; --ig: #D6249F;
  --display: "Fredoka", "Plus Jakarta Sans", system-ui, sans-serif; --font: "Plus Jakarta Sans", system-ui, -apple-system, sans-serif; --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0F0E14; --card: #18171F; --ink: #F4F2F8; --ink2: #B6B1C4; --ink3: #7D788D; --line: #2A2834; --soft: #24222C;
  --ok-soft: #10301F; --warn-soft: #33270F; --tt: #F4F2F8; color-scheme: dark; } }
:root[data-theme="dark"] { --bg: #0F0E14; --card: #18171F; --ink: #F4F2F8; --ink2: #B6B1C4; --ink3: #7D788D; --line: #2A2834; --soft: #24222C;
  --ok-soft: #10301F; --warn-soft: #33270F; --tt: #F4F2F8; color-scheme: dark; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 15px; line-height: 1.45; -webkit-font-smoothing: antialiased; }
.wrap { max-width: 1180px; margin: 0 auto; padding-inline: 16px; padding-block: 20px 60px; display: grid; gap: 20px; }
header { display: flex; flex-wrap: wrap; gap: 10px 20px; align-items: end; justify-content: space-between; }
h1 { font-family: var(--display); font-size: 28px; margin: 0; }
h2 { font-family: var(--display); font-size: 20px; margin: 0 0 12px; text-wrap: balance; }
.meta { color: var(--ink3); font-size: 13px; }
a { color: var(--violet); }
button, .btn { font: inherit; font-weight: 700; font-size: 14px; border: 1px solid var(--line); background: var(--card); color: var(--ink); padding: 9px 14px; border-radius: 11px; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; }
button.primary, .btn.primary { background: var(--brand); border-color: var(--brand); color: #fff; }
button:disabled { opacity: .6; cursor: wait; }
.box { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 16px; min-width: 0; }
/* Generator */
.gen { display: grid; gap: 10px; }
.gen .hd { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.gen iframe { width: 100%; height: min(86vh, 900px); border: 1px solid var(--line); border-radius: 14px; background: var(--bg); }
.gen code { background: var(--soft); padding: 2px 6px; border-radius: 6px; font-family: var(--mono); font-size: 13px; }
/* Aufrufe */
.views { display: flex; flex-wrap: wrap; gap: 8px 28px; align-items: baseline; }
.views .big { font-family: var(--mono); font-weight: 700; font-size: 34px; font-variant-numeric: tabular-nums; line-height: 1.1; }
.views .lb { font-size: 11px; color: var(--ink3); text-transform: uppercase; letter-spacing: .08em; font-weight: 700; }
.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(270px, 1fr)); gap: 14px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 16px; display: grid; gap: 12px; min-width: 0; }
.card .top { display: flex; align-items: center; gap: 10px; }
.card .top img { width: 34px; height: 34px; border-radius: 50%; object-fit: cover; }
.card .top b { font-family: var(--display); font-size: 18px; }
.pl { display: grid; grid-template-columns: 92px repeat(4, 1fr); gap: 6px; align-items: center; padding: 8px 0; border-top: 1px solid var(--line); }
.pl .p { display: flex; align-items: center; gap: 6px; font-weight: 700; font-size: 13px; }
.pl .p svg { width: 16px; height: 16px; flex: none; }
.pl .v { font-family: var(--mono); font-weight: 700; font-size: 16px; font-variant-numeric: tabular-nums; display: block; }
.pl .k { font-size: 10px; color: var(--ink3); text-transform: uppercase; letter-spacing: .05em; }
.pl.none { color: var(--ink3); font-size: 13px; grid-template-columns: 92px 1fr; }
.next { font-size: 13px; color: var(--ink2); }
.tbl { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
th, td { text-align: right; padding: 9px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
th { font-size: 11px; color: var(--ink3); text-transform: uppercase; letter-spacing: .05em; font-weight: 700; }
th:nth-child(-n+2), td:nth-child(-n+2) { text-align: left; }
td { font-family: var(--mono); } td:nth-child(2) { font-family: var(--font); font-weight: 700; }
th.g { text-align: center; border-bottom: 0; padding-bottom: 0; }
.rank { font-family: var(--display); font-size: 18px; }
.hint { font-size: 12px; color: var(--ink3); margin-top: 10px; }
/* Analyse-Agent */
.an .hd { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-bottom: 4px; }
.proto { border-top: 1px solid var(--line); padding-block: 12px; display: grid; gap: 10px; }
.proto summary { cursor: pointer; font-weight: 700; }
.proto ul { margin: 4px 0 0; padding-left: 18px; display: grid; gap: 5px; }
.proto h3 { margin: 6px 0 0; font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--ink3); }
.pill { font-size: 12px; font-weight: 800; padding: 4px 10px; border-radius: 999px; background: var(--soft); color: var(--ink2); }
.pill.ok { background: var(--ok-soft); color: var(--ok); } .pill.warn { background: var(--warn-soft); color: var(--warn); }
.conn { display: grid; gap: 6px; margin-top: 10px; }
.conn div { display: flex; justify-content: space-between; align-items: center; gap: 10px; border-top: 1px solid var(--line); padding-top: 6px; font-size: 14px; }
.lock { max-width: 360px; margin: 18vh auto; display: grid; gap: 12px; }
.lock input { font: inherit; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--card); color: var(--ink); }
@media (max-width: 640px) { .pl { grid-template-columns: 78px repeat(4, 1fr); } }
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
const API = 'https://hsjceeclecvkjbusabpg.supabase.co/functions/v1/cockpit', GEN = 'http://localhost:4350';
const P = {
  Lia: { slots: { ig: 'instagram_lia', tt: 'tiktok_lia' }, nick: 'lia' },
  Laurene: { slots: { ig: 'instagram_laurene', tt: 'tiktok_laurene' }, nick: 'laurene' },
  Elena: { slots: { tt: 'tiktok_elena' }, nick: 'elena' },
  Leni: { slots: { ig: 'instagram_leni', tt: 'tiktok_leni' }, nick: 'leni' }
};
const NAMES = Object.keys(P);
const ICON = {
  tt: `<svg viewBox="0 0 24 24"><path fill="var(--tt)" d="M16.6 3c.4 2.2 1.8 3.7 4 3.9v3.2c-1.5 0-2.9-.4-4-1.2v6.2c0 3.3-2.6 5.9-5.9 5.9S4.8 18.4 4.8 15.1s2.6-5.9 5.9-5.9c.3 0 .6 0 .9.1v3.3a2.7 2.7 0 1 0 1.8 2.5V3h3.2z"/></svg>`,
  ig: `<svg viewBox="0 0 24 24"><defs><linearGradient id="igg" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#FEDA75"/><stop offset=".5" stop-color="#D62976"/><stop offset="1" stop-color="#4F5BD5"/></linearGradient></defs><rect x="3" y="3" width="18" height="18" rx="5" fill="none" stroke="url(#igg)" stroke-width="2.4"/><circle cx="12" cy="12" r="4" fill="none" stroke="url(#igg)" stroke-width="2.4"/><circle cx="17.3" cy="6.7" r="1.3" fill="#D62976"/></svg>`
};
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
const fmt = n => n == null ? '–' : Number(n).toLocaleString('de-CH');
const store = { get: k => { try { return localStorage.getItem(k); } catch { return null; } }, set: (k, v) => { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch { } } };
const zh = d => new Intl.DateTimeFormat('sv-SE', { timeZone: 'Europe/Zurich', year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', hour12: false }).format(d);
const swiss = (o = 0) => zh(new Date(Date.now() + o * 864e5)).slice(0, 10);
const hhmm = t => zh(new Date(t)).slice(11, 16);
const dlabel = d => new Date(d + 'T12:00:00Z').toLocaleDateString('de-CH', { weekday: 'short', day: 'numeric', month: 'numeric' });
let key = store.get('cockpit-key') || '', D = null, S = null, genUp = null;

function plat(n, k) {
  const L = S?.latest?.[P[n].slots[k]];
  if (L) { const ps = (L.posts ?? []).filter(q => Date.parse(q.at) > Date.now() - 30 * 864e5);
    return { views: ps.reduce((a, q) => a + (q.views ?? 0), 0), likes: ps.reduce((a, q) => a + (q.likes ?? 0), 0), posts: ps.length, fol: L.followers }; }
  const a = D?.[n]?.analysis ?? {}, x = a.plat?.[k] ?? {}; return { views: x.views, likes: x.likes, posts: x.posts, fol: a.followers?.[k]?.followers };
}
const clicks = n => D?._clicks?.[P[n].nick] ?? { bio: 0, store: 0 };
function board() {
  return NAMES.map(n => { const t = plat(n, 'tt'), i = P[n].slots.ig ? plat(n, 'ig') : {}, c = clicks(n); return { n, tt: t, ig: i, views: (t.views ?? 0) + (i.views ?? 0), ...c }; })
    .sort((a, b) => b.store - a.store || b.bio - a.bio || b.views - a.views);
}

async function load() {
  const h = { headers: { 'x-cockpit-key': key } }, [r, rs] = await Promise.all([fetch(API + '?agents', h), fetch(API, h)]);
  if (r.status === 401) { store.set('cockpit-key', null); key = ''; return lock('Der Schlüssel stimmt nicht.'); }
  const first = !D; D = await r.json(); S = await rs.json().catch(() => S); first ? render() : update();
}
function lock(err = '') {
  $('#app').innerHTML = `<form class="lock" id="lf"><h1>Brained Agents</h1><div class="meta">Gleicher Schlüssel wie im Cockpit.</div>
  <input id="k" type="password" placeholder="Cockpit-Schlüssel" autocomplete="current-password">${err ? `<div style="color:var(--bad)">${esc(err)}</div>` : ''}<button class="primary">Öffnen</button></form>`;
  $('#lf').onsubmit = e => { e.preventDefault(); key = $('#k').value.trim(); store.set('cockpit-key', key); load(); };
}

// ---------- Generator (Post-Übersetzer läuft lokal auf diesem Mac) ----------
async function genCheck() {
  try { await fetch(GEN + '/api/status', { mode: 'no-cors', cache: 'no-store' }); genUp = true; } catch { genUp = false; }
  const el = $('#gen'); if (!el) return;
  el.innerHTML = `<div class="hd"><h2 style="margin:0">Generator · Post-Übersetzer</h2><span><span class="pill ${genUp ? 'ok' : 'warn'}">${genUp ? 'läuft' : 'nicht gestartet'}</span> ${genUp ? `<a class="btn" href="${GEN}" target="_blank" rel="noopener">In neuem Tab</a>` : '<button id="retry">Nochmals prüfen</button> <a class="btn" href="'+GEN+'" target="_blank" rel="noopener">Generator öffnen</a>'}</span></div>`
    + (genUp ? `<iframe src="${GEN}" title="Post-Übersetzer"></iframe>`
      : `<p class="meta" style="margin:0">Der Generator läuft auf deinem Mac. Starte ihn mit dem Doppelklick auf <code>Post-Übersetzer.command</code> auf dem Desktop. Danach erscheint er hier. Falls dein Browser die Prüfung blockiert, öffnet «Generator öffnen» ihn in einem eigenen Tab.</p>`);
  $('#retry')?.addEventListener('click', genCheck);
}

function render() {
  $('#app').innerHTML = `
  <header><div><h1>Brained Agents</h1><div class="meta">Social Media: Generator, Zahlen und Analyse · <a href="./">zum Cockpit</a></div></div>
    <button id="fetch">Zahlen holen</button></header>
  <section class="box gen" id="gen"><div class="meta">Prüfe Generator …</div></section>
  <section class="box" id="views"></section>
  <section class="cards" id="cards"></section>
  <section class="box" id="rang"></section>
  <section class="box an" id="an"></section>
  <details class="box" id="conn"></details>`;
  $('#fetch').onclick = async e => { const b = e.target; b.disabled = true; b.textContent = 'hole …';
    try { await fetch(API + '?collect', { method: 'POST', headers: { 'x-cockpit-key': key } }); await load(); b.textContent = 'aktuell ✓'; } catch { b.textContent = 'Fehler'; }
    setTimeout(() => { b.disabled = false; b.textContent = 'Zahlen holen'; }, 4000); };
  genCheck(); update();
}
function update() { views(); cards(); rang(); analyse(); conn(); }

function views() { // aktuelle Aufrufe (30 Tage), ohne Zielbalken
  let t = 0, i = 0, up = '';
  for (const n of NAMES) { t += plat(n, 'tt').views ?? 0; if (P[n].slots.ig) i += plat(n, 'ig').views ?? 0; }
  const u = Object.values(S?.latest ?? {}).map(x => x?.updated_at).filter(Boolean).sort().pop();
  $('#views').innerHTML = `<div class="views"><div><div class="lb">Aufrufe · letzte 30 Tage</div><div class="big">${fmt(t + i)}</div></div>
    <div><div class="lb">TikTok</div><div class="big">${fmt(t)}</div></div><div><div class="lb">Instagram</div><div class="big">${fmt(i)}</div></div></div>
    <div class="hint">${u ? 'Zahlen von ' + dlabel(zh(new Date(u)).slice(0, 10)) + ' ' + hhmm(u) : ''}</div>`;
}
function platRow(n, k) {
  if (k === 'ig' && !P[n].slots.ig) return `<div class="pl none"><span class="p">${ICON.ig}Instagram</span><span>kein Konto</span></div>`;
  const x = plat(n, k);
  return `<div class="pl"><span class="p">${ICON[k]}${k === 'tt' ? 'TikTok' : 'Instagram'}</span>
    <div><span class="v">${fmt(x.views)}</span><span class="k">Aufrufe</span></div><div><span class="v">${fmt(x.likes)}</span><span class="k">Likes</span></div>
    <div><span class="v">${fmt(x.fol)}</span><span class="k">Follower</span></div><div><span class="v">${fmt(x.posts)}</span><span class="k">Posts</span></div></div>`;
}
function cards() {
  $('#cards').innerHTML = NAMES.map(n => { const s = D[n] ?? {};
    const nx = (s.calendar ?? []).filter(i => i.status !== 'online' && i.status !== 'fehler' && i.date >= swiss()).sort((a, b) => (a.date + a.time).localeCompare(b.date + b.time))[0];
    return `<article class="card"><div class="top"><img src="av/${P[n].nick}.jpg" alt=""><b>${n}</b><span class="meta" style="margin-left:auto">30 Tage${s.analysis?.trend ? ' · Trend ' + esc(s.analysis.trend) : ''}</span></div>
      <div>${platRow(n, 'tt')}${platRow(n, 'ig')}</div>
      <div class="next">${nx ? `Nächster Post: <b>${dlabel(nx.date)} ${esc(nx.time)}</b> · ${esc(nx.format)} · ${esc(nx.status)}` : 'Noch kein Post geplant'}</div></article>`; }).join('');
}
function rang() {
  $('#rang').innerHTML = `<h2>Rangliste · letzte 30 Tage</h2><div class="tbl"><table>
    <thead><tr><th></th><th></th><th class="g" colspan="2">Bio-Link</th><th class="g" colspan="2">TikTok</th><th class="g" colspan="2">Instagram</th></tr>
    <tr><th>#</th><th>Persona</th><th>Store</th><th>Klicks</th><th>Aufrufe</th><th>Follower</th><th>Aufrufe</th><th>Follower</th></tr></thead>
    <tbody>${board().map((b, i) => `<tr><td class="rank">${['🥇', '🥈', '🥉'][i] ?? i + 1}</td><td>${b.n}</td><td>${fmt(b.store)}</td><td>${fmt(b.bio)}</td>
      <td>${fmt(b.tt.views)}</td><td>${fmt(b.tt.fol)}</td><td>${P[b.n].slots.ig ? fmt(b.ig.views) : '–'}</td><td>${P[b.n].slots.ig ? fmt(b.ig.fol) : '–'}</td></tr>`).join('')}</tbody></table></div>
    <div class="hint">Sortiert nach Store-Klicks (Klicks auf den Bio-Link, die in den App Store oder Google Play führen – der beste Hinweis auf Downloads pro Persona), dann Bio-Klicks, dann Aufrufe.</div>`;
}

// ---------- Analyse-Agent: ruht im Hintergrund, läuft nur auf Knopfdruck ----------
const list = (t, a) => a?.length ? `<h3>${t}</h3><ul>${a.map(x => `<li>${esc(typeof x === 'string' ? x : [x.persona, x.plattform].filter(Boolean).join(' · ') + (x.text ? ' – «' + x.text + '»' : '') + (x.warum ? ': ' + x.warum : ''))}</li>`).join('')}</ul>` : '';
function analyse() {
  const pr = (D?.analyse?.protocols ?? []).slice().reverse();
  $('#an').innerHTML = `<div class="hd"><h2 style="margin:0">Analyse-Agent</h2><button class="primary" id="go">Analyse starten</button></div>
    <div class="meta" id="anst">${pr[0] ? 'Letzte Analyse: ' + dlabel(zh(new Date(pr[0].t)).slice(0, 10)) + ' ' + hhmm(pr[0].t) : 'Noch keine Analyse. Der Agent ruht, bis du auf «Analyse starten» klickst.'}</div>
    ${pr.map((p, i) => `<details class="proto" ${i === 0 ? 'open' : ''}><summary>Protokoll ${dlabel(zh(new Date(p.t)).slice(0, 10))} ${hhmm(p.t)} · ${fmt(p.posts)} Posts ausgewertet</summary>
      <div>${esc(p.zusammenfassung ?? '')}</div>${list('Hat am besten funktioniert', p.beste)}${list('Hat schlecht funktioniert', p.schwache)}${list('Muster', p.muster)}${list('Empfehlungen', p.empfehlungen)}</details>`).join('')}`;
  $('#go').onclick = async e => { const b = e.target; b.disabled = true; b.textContent = 'analysiert …'; $('#anst').textContent = 'Der Agent liest alle Posts der letzten 30 Tage. Das dauert bis zu einer Minute.';
    try { const r = await fetch(API + '?analyse', { method: 'POST', headers: { 'x-cockpit-key': key } }); const d = await r.json(); if (d.error) throw new Error(d.error); await load(); }
    catch (err) { $('#anst').textContent = 'Fehler: ' + err.message; b.disabled = false; b.textContent = 'Analyse starten'; } };
}

// ---------- Verbindungen (Instagram/TikTok), bleiben bestehen ----------
function conn() {
  const el = $('#conn'); if (!el || el.open) return; const sl = S?.slots ?? {}, C = S?.connected ?? {}, can = S?.can_connect ?? {};
  el.innerHTML = `<summary style="cursor:pointer;font-weight:700">Verbindungen</summary><div class="conn">${Object.keys(sl).filter(p => sl[p] !== 'Brained').map(p => `<div><span>${p.startsWith('instagram') ? 'Instagram' : 'TikTok'} · ${esc(sl[p])} <span class="pill ${C[p] ? 'ok' : 'warn'}">${C[p] ? 'verbunden' : 'nicht verbunden'}</span></span>
    ${can[p] ? `<a class="btn" href="${API}?connect=${p}&k=${encodeURIComponent(key)}">${C[p] ? 'Neu verbinden' : 'Verbinden'}</a>` : ''}</div>`).join('')}</div>
    <div class="hint">Vorher im Browser mit dem richtigen Konto anmelden, dann auf «Verbinden».</div>`;
}
setInterval(() => key && D && load().catch(() => { }), 120e3);
key ? load().catch(e => lock(e.message)) : lock();
</script>
</body>
</html>
